version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/sarkar-ai-taken/hoofprint/internal/agentproto
plugins:
  - local: protoc-gen-go
    out: internal/agentproto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/agentproto
    opt: paths=source_relative
