{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hoofprint.fullname" . }}-api
  labels:
    {{- include "hoofprint.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hoofprint.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hoofprint.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}/hoofprint-api:{{ include "hoofprint.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --http=:{{ .Values.api.service.httpPort }}
            - --grpc=:{{ .Values.api.service.grpcPort }}
            - --log-level={{ .Values.api.logLevel }}
          env:
            - name: HOOFPRINT_DATABASE_URL
              value: {{ include "hoofprint.databaseURL" . | quote }}
            - name: HOOFPRINT_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hoofprint.tokenSecretName" . }}
                  key: token
          ports:
            - name: http
              containerPort: {{ .Values.api.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.api.service.grpcPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hoofprint.fullname" . }}-api
  labels:
    {{- include "hoofprint.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "hoofprint.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.httpPort }}
      targetPort: http
      {{- if .Values.api.service.httpNodePort }}
      nodePort: {{ .Values.api.service.httpNodePort }}
      {{- end }}
    - name: grpc
      port: {{ .Values.api.service.grpcPort }}
      targetPort: grpc
      {{- if .Values.api.service.grpcNodePort }}
      nodePort: {{ .Values.api.service.grpcNodePort }}
      {{- end }}
{{- end }}
