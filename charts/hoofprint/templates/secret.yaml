{{- if not .Values.agent.existingSecret }}
{{- if not .Values.agentToken }}
{{- fail "agentToken is required (or set agent.existingSecret). Generate one with: openssl rand -hex 24" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hoofprint.tokenSecretName" . }}
  labels: {{- include "hoofprint.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.agentToken | quote }}
{{- end }}
